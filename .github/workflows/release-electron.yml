name: Release desktop

# I pacchetti di Electron si costruiscono qui e la release pubblicata su
# GitHub è quella marcata come latest, così chi scarica "ultima versione"
# prende sempre l'ultima reale e non una prerelease.
#
# Parte da due eventi:
#   - un tag "v<versione>", spinto da una persona (o dal workflow di
#     versionazione, se avesse un permesso per farlo);
#   - un push su master, il caso normale.
#
# Perché il secondo? Un workflow non ne innesca un altro quando usa
# GITHUB_TOKEN: il tag creato dal workflow di versionazione partirebbe
# qui solo se il token non fosse quello del bot, e il rilascio non
# partirebbe mai. Quindi su master questo workflow risolve la versione da
# sé, crea il tag se manca, e non fa niente se quella versione è già
# stata rilasciata.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da rilasciare (vuoto = versione attuale)
        required: false

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  prepara:
    runs-on: ubuntu-latest
    outputs:
      versione: ${{ steps.scegli.outputs.versione }}
      daRilasciare: ${{ steps.scegli.outputs.daRilasciare }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Scegli la versione
        id: scegli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TIPO: ${{ github.ref_type }}
          REF_NOME: ${{ github.ref_name }}
          TAG_MANUALE: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_MANUALE:-}"
          if [ "$REF_TIPO" = "tag" ]; then TAG="$REF_NOME"; fi
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
            echo "Nessun tag dato: uso $TAG dalla versione del pacchetto."
          fi
          echo "versione=$TAG" >> "$GITHUB_OUTPUT"

          node scripts/versione-check.mjs

          # Se la release c'è già, non si ricostruisce tutto: il tag e gli
          # artefatti esistono e rifare il lavoro sarebbe solo sprecato.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: niente da fare."
            echo "daRilasciare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Il tag serve comunque: è lui che identifica la versione nei
          # pacchetti e nelle note.
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Creato e pubblicato il tag $TAG."
          else
            echo "Il tag $TAG esiste già."
          fi
          echo "daRilasciare=true" >> "$GITHUB_OUTPUT"

  impacchetta:
    needs: prepara
    if: needs.prepara.outputs.daRilasciare == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: mac
          - os: windows-latest
            nome: win
          - os: ubuntu-latest
            nome: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: La versione corrisponde al tag
        run: node scripts/versione-check.mjs
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ needs.prepara.outputs.versione }}

      - name: Dipendenze
        run: bun install --frozen-lockfile

      - name: Build della web
        # L'app desktop si apre da file://, quindi qui la base è la radice.
        run: bun run build

      - name: Copia nel renderer di Electron
        run: node scripts/copia-renderer.mjs

      - name: Dipendenze di Electron
        working-directory: electron
        run: npm install

      - name: electron-builder
        working-directory: electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica gli artefatti
        uses: actions/upload-artifact@v4
        with:
          name: reportini-${{ matrix.nome }}
          # Solo i pacchetti installabili, non le cartelle scompattate:
          # win-unpacked e linux-unpacked sono centinaia di file che
          # appesantirebbero la release di qualche centinaia di megabyte
          # senza che nessuno li scarichi.
          #
          # Insieme ai pacchetti vanno pubblicati anche i file latest*.yml:
          # sono il menù che electron-updater legge per sapere se c'è una
          # versione nuova, e senza quelli l'app installata non si aggiorna
          # da sola. Lo .zip serve sulla mac: aggiornare da .dmg non si può.
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.blockmap
            electron/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  pubblica:
    needs: [prepara, impacchetta]
    if: needs.prepara.outputs.daRilasciare == 'true'
    runs-on: ubuntu-latest
    steps:
      # gh release create lavora su un repository git: senza checkout non
      # trova il tag e si ferma.
      - uses: actions/checkout@v4

      - name: Scarica gli artefatti
        uses: actions/download-artifact@v4
        with:
          path: pacchetti

      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONE: ${{ needs.prepara.outputs.versione }}
        run: |
          # I pacchetti finiscono sotto pacchetti/<nome>/: si appiattiscono
          # in una directory sola, altrimenti la release avrebbe allegati
          # dentro cartelle che l'utente non aspetta.
          mkdir -p dist
          find pacchetti -maxdepth 2 -type f -exec cp {} dist/ \;
          ls -l dist

          # Una release senza i tre sistemi è una release a metà: meglio
          # fermarsi che pubblicarla e dirsi che tanto è quasi uguale.
          for estensione in dmg exe AppImage; do
            if ! ls dist/*."$estensione" >/dev/null 2>&1; then
              echo "::error::Manca il pacchetto .$estensione"
              exit 1
            fi
          done

          # Gli stessi tre sistemi devono avere anche il menù degli
          # aggiornamenti: senza latest*.yml l'app installata continua a
          # restare sulla versione vecchia per sempre, e questo non si vede.
          for menu in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "dist/$menu" ]; then
              echo "::error::Manca $menu: l'aggiornamento automatico non funzionerebbe"
              exit 1
            fi
          done

          gh release create "$VERSIONE" dist/* \
            --title "Reportini $VERSIONE" \
            --generate-notes \
            --latest
