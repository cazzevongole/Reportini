name: Versione e rilascio desktop

# Un solo workflow per due cose che non si possono separare: decidere il
# numero della versione e costruire i pacchetti con quel numero.
#
# Prima erano due, e la corsa fra loro produceva release sbagliate. Al merge
# partivano insieme: questo leggeva la versione da package.json **prima** che
# l'altro la alzasse, quindi costruiva e pubblicava una release con il numero
# vecchio mentre il tag nuovo restava senza pacchetti. Poi il commit di
# versione ripartiva il rilascio, che rifaceva tutto da capo con il numero
# giusto: due release per un merge, una delle quali etichettata come
# "latest" mentre il pacchetto contiene l'altra versione. E l'aggiornamento
# automatico leggeva un latest.yml incoerente con il proprio pacchetto.
#
# Adesso la versione la decide ed usa la stessa esecuzione che costruisce, e
# i pacchetti si compilano dal tag: build e release non possono più
# discordare.
#
# Quando parte:
#   - push su master: alza la versione (patch), fa commit e tag, e rilascia;
#   - push di un tag v*: rilascia quella versione così com'è, senza alzarla;
#   - a mano: "livel" per forzare minor o major, "tag" per rilasciare un tag
#     esistente.
#
# paths-ignore vale solo per i push su master. Il workflow parte se almeno un
# file toccati dal commit non è in elenco, quindi un commit mistro (qualcosa
# dentro src/ più un README) rilascia normalmente.
#
# Nell'elenco ci sono due categorie, e la seconda è quella che evita i
# rilasci inutili.
#
# 1. Il commit di versione tocca package.json, electron/package.json e
#    CHANGELOG.md: senza questo filtro il workflow si rilancierebbe da solo
#    all'infinito.
#
# 2. Ciò che non entra nel pacchetto desktop. La web e il desktop sono lo
#    stesso codice — il pacchetto è la build di src/ copiata in
#    electron/renderer — quindi qui si possono ignorare solo i file che
#    davvero non ci arrivano: le funzioni Supabase, la documentazione, gli
#    script di CI e di versione, i file di configurazione della formattazione,
#    i workflow di CI e di deploy della web, e i test. src/, public/,
#    index.html e la configurazione di build non ci sono e non possono esserci:
#    un commit che li tocca cambia l'app che l'utente scarica, e per quello il
#    rilascio serve.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      # Il commit di versione, per non ripartire da solo.
      - "package.json"
      - "electron/package.json"
      - "CHANGELOG.md"
      # L'ordine di livello: dice al prossimo rilascio quanto deve salire e
      # viene cancellato quando è stato eseguito. Se non fosse qui, il
      # commit che lo prepara farebbe partire un rilascio subito — con il
      # livello che si voleva applicare *a quel* rilascio.
      - ".rilascio"
      # Non finisce nel pacchetto: backend, documenti, CI, deploy della web.
      - "supabase/**"
      - "tests/**"
      - "README.md"
      - ".gitignore"
      - "scripts/**"
      - ".prettierignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-pages.yml"
      # Anche questo workflow è "non finisce nel pacchetto", e per la stessa
      # ragione: cambiarlo non cambia l'app che l'utente scarica. Senza questa
      # riga, il commit che introduce il filtro rilascierebbe una versione
      # identica alla precedente. Per provare una modifica al workflow si
      # usa il rilascio a mano qui sotto, che il filtro non riguarda.
      - ".github/workflows/release-electron.yml"
  workflow_dispatch:
    inputs:
      livello:
        description: "Quanto alzare la versione (solo se non è indicato un tag)"
        type: choice
        default: patch
        options: [patch, minor, major]
      tag:
        description: "Tag da rilasciare, vuoto = versione attuale (non lo alza)"
        required: false

permissions:
  contents: write

# Le due esecuzioni non si pestano i piedi: se ne arriva un'altra, aspetta.
concurrency:
  group: rilascio
  cancel-in-progress: false

jobs:
  versione:
    # Immagine bloccata, non "latest": GitHub annuncia la migrazione di
    # ubuntu-latest a Ubuntu 26 e avvisa su ogni run. Qui si vuole la 24.04,
    # che è quella nota, finché non la si cambia di proposito.
    runs-on: ubuntu-24.04
    outputs:
      versione: ${{ steps.scegli.outputs.versione }}
      daRilasciare: ${{ steps.scegli.outputs.daRilasciare }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun bloccato, non "latest": le due cose che devono dare lo stesso
          # risultato -- la misura del bundle e il formato del lockfile -- non
          # possono dipendere dalla versione di bun che trova il runner. Quando
          # si alza bun, si alza anche questo numero: `bun upgrade` in locale e
          # un commit di package.json/bun.lock insieme a questa riga.
          bun-version: 1.4.2

      - name: Scegli la versione
        id: scegli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TIPO: ${{ github.ref_type }}
          REF_NOME: ${{ github.ref_name }}
          TAG_MANUALE: ${{ inputs.tag }}
          LIVELLO: ${{ inputs.livello || 'patch' }}
        run: |
          set -euo pipefail

          TAG="${TAG_MANUALE:-}"
          # Un tag spinto a mano rilascia quello che è, senza alzare niente:
          # il numero lo ha già deciso qualcuno.
          if [ "$REF_TIPO" = "tag" ]; then TAG="$REF_NOME"; fi

          # Il file `.rilascio` nella radice, quando c'è, vale più di
          # LIVELLO: è l'ordine esplicito per il prossimo rilascio ("questa
          # volta minor") e vale anche quando il rilascio parte da solo, da un
          # push su master. Lo script lo cancella dopo averlo usato, quindi un
          # rilascio successivo torna al default.
          if [ -f .rilascio ]; then
            LIVELLO=$(tr -d '[:space:]' < .rilascio)
            echo "Ordine di livello in .rilascio: $LIVELLO"
          fi

          if [ -z "$TAG" ]; then
            # Push su master: qui la versione la decidiamo noi, e subito,
            # nello stesso passaggio che poi costruisce i pacchetti.
            node scripts/versione.mjs "$LIVELLO"
            VERSIONE=$(node -p "require('./package.json').version")
            TAG="v$VERSIONE"

            node scripts/versione.mjs

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json electron/package.json CHANGELOG.md
            git commit -m "Versione $VERSIONE"
            git tag "$TAG"
            git push origin "HEAD:master" "$TAG"
            echo "Versione alzata a $VERSIONE e tag $TAG pubblicato."
          else
            echo "Rilascio della versione $TAG, senza alzarla."
          fi
          echo "versione=$TAG" >> "$GITHUB_OUTPUT"

          # Coerenza fra i due package.json e il tag: un pacchetto col numero
          # diverso da quello che si scarica è un rilascio sbagliato, e non
          # c'è modo di accorgersene dopo.
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$TAG" node scripts/versione.mjs

          # Se la release c'è già, non si ricostruisce tutto: il tag e gli
          # artefatti esistono e rifare il lavoro sarebbe solo sprecato.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG esiste già: niente da fare."
            echo "daRilasciare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "daRilasciare=true" >> "$GITHUB_OUTPUT"

  impacchetta:
    needs: versione
    if: needs.versione.outputs.daRilasciare == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            nome: mac
          - os: windows-latest
            nome: win
          # Come sopra: immagine bloccata, così il pacchetto Linux si
          # costruisce sempre sulla stessa e non su un'etichetta che migra.
          - os: ubuntu-24.04
            nome: linux
    runs-on: ${{ matrix.os }}
    # Le variabili VITE_* stanno nell'ambiente "prod", e GitHub le rende
    # disponibili solo ai job che lo dichiarano. Senza questa riga il build
    # dell'app desktop le vede tutte vuote: Vite le sostituisce con stringhe
    # vuote e il pacchetto si apre su una schermata di accesso che non può
    # mai entrare, perché Supabase non è collegato. Meglio un pacchetto che
    # non esce che uno che sembra funzionante e non lo è.
    environment: prod
    steps:
      # Si compila dal tag, non dal commit che ha fatto partire il workflow:
      # è il tag che contiene il commit di versione, ed è l'unico modo perché
      # electron-builder metta nel pacchetto lo stesso numero della release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versione.outputs.versione }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun bloccato, non "latest": le due cose che devono dare lo stesso
          # risultato -- la misura del bundle e il formato del lockfile -- non
          # possono dipendere dalla versione di bun che trova il runner. Quando
          # si alza bun, si alza anche questo numero: `bun upgrade` in locale e
          # un commit di package.json/bun.lock insieme a questa riga.
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: La versione corrisponde al tag
        run: node scripts/versione.mjs
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ needs.versione.outputs.versione }}

      - name: Dipendenze
        run: bun install --frozen-lockfile

      - name: Controlla la configurazione
        # shell: bash esplicito perché il runner Windows usa PowerShell, dove
        # `[ -z "$VAR" ]` non è un test: lo script fallirebbe sempre, o peggio
        # passerebbe senza controllare niente. È lo stesso motivo per cui
        # esiste scripts/copia-renderer.mjs invece di `rm -rf && cp -R`.
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY nell'ambiente 'prod' (Settings > Secrets and variables > Actions > Variables > prod)."
            exit 1
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build della web
        # ELECTRON=1 forza la base "./": l'app si apre da file://, dove un
        # percorso assoluto come /assets/app.js punterebbe alla radice del
        # filesystem e non troverebbe nulla. Con la base relativa il pacchetto
        # si apre su qualunque disco e per qualunque utente.
        #
        # Le stesse VITE_* della web: il pacchetto desktop è la stessa app,
        # e senza Supabase non c'è account, quindi non c'è nemmeno una
        # pagina. La chiave pubblica e il client id sono pubblici per
        # definizione — il secret di Google resta nella Edge Function.
        run: bun run build
        env:
          ELECTRON: "1"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Copia nel renderer di Electron
        run: node scripts/copia-renderer.mjs

      - name: Dipendenze di Electron
        working-directory: electron
        run: npm install

      - name: electron-builder
        working-directory: electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica gli artefatti
        uses: actions/upload-artifact@v7
        with:
          name: reportini-${{ matrix.nome }}
          # Solo i pacchetti installabili, non le cartelle scompattate:
          # win-unpacked e linux-unpacked sono centinaia di file che
          # appesantirebbero la release di qualche centinaio di megabyte
          # senza che nessuno li scarichi.
          #
          # Insieme ai pacchetti vanno pubblicati anche i file latest*.yml:
          # sono il menù che electron-updater legge per sapere se c'è una
          # versione nuova, e senza quelli l'app installata non si aggiorna
          # da sola. Lo .zip serve sulla mac: aggiornare da .dmg non si può.
          path: |
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.blockmap
            electron/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  pubblica:
    needs: [versione, impacchetta]
    if: needs.versione.outputs.daRilasciare == 'true'
    # Immagine bloccata, non "latest": GitHub annuncia la migrazione di
    # ubuntu-latest a Ubuntu 26 e avvisa su ogni run. Qui si vuole la 24.04,
    # che è quella nota, finché non la si cambia di proposito.
    runs-on: ubuntu-24.04
    steps:
      # gh release create lavora su un repository git: senza checkout non
      # trova il tag e si ferma.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versione.outputs.versione }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun bloccato, non "latest": le due cose che devono dare lo stesso
          # risultato -- la misura del bundle e il formato del lockfile -- non
          # possono dipendere dalla versione di bun che trova il runner. Quando
          # si alza bun, si alza anche questo numero: `bun upgrade` in locale e
          # un commit di package.json/bun.lock insieme a questa riga.
          bun-version: 1.4.2

      - name: Scarica gli artefatti
        uses: actions/download-artifact@v8
        with:
          path: pacchetti

      - name: Crea la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONE: ${{ needs.versione.outputs.versione }}
        run: |
          # I pacchetti finiscono sotto pacchetti/<nome>/: si appiattiscono
          # in una directory sola, altrimenti la release avrebbe allegati
          # dentro cartelle che l'utente non aspetta.
          mkdir -p dist
          find pacchetti -maxdepth 2 -type f -exec cp {} dist/ \;
          ls -l dist

          # Una release senza i tre sistemi è una release a metà: meglio
          # fermarsi che pubblicarla e dirsi che tanto è quasi uguale.
          for estensione in dmg exe AppImage; do
            if ! ls dist/*."$estensione" >/dev/null 2>&1; then
              echo "::error::Manca il pacchetto .$estensione"
              exit 1
            fi
          done

          # Gli stessi tre sistemi devono avere anche il menù degli
          # aggiornamenti: senza latest*.yml l'app installata continua a
          # restare sulla versione vecchia per sempre, e questo non si vede.
          for menu in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "dist/$menu" ]; then
              echo "::error::Manca $menu: l'aggiornamento automatico non funzionerebbe"
              exit 1
            fi
          done

          # Ogni nome che i menù promettono devono essere un file davvero
          # pubblicato. electron-builder può scrivere nel menù un nome diverso
          # da quello del file che produce: è successo su Windows, dove il
          # menù prometteva "Reportini-Setup-0.1.24.exe" e l'allegato si
          # chiamava "Reportini.Setup.0.1.24.exe". L'aggiornamento finiva in
          # un 404, l'app installata restava sulla versione vecchia, e
          # l'unico sintomo era che "non si aggiorna" — senza un errore da
          # nessuna parte. Qui il rilascio si ferma invece di pubblicare un
          # aggiornamento che non si può scaricare.
          node scripts/verifica-menu-aggiornamento.mjs dist

          gh release create "$VERSIONE" dist/* \
            --title "Reportini $VERSIONE" \
            --generate-notes \
            --latest
