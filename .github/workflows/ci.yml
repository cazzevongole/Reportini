name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Immagine bloccata, non "latest": GitHub annuncia la migrazione di
    # ubuntu-latest a Ubuntu 26 e avvisa su ogni run. Qui si vuole la 24.04,
    # che è quella nota, finché non la si cambia di proposito.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Bun bloccato, non "latest": le due cose che devono dare lo stesso
          # risultato -- la misura del bundle e il formato del lockfile -- non
          # possono dipendere dalla versione di bun che trova il runner. Quando
          # si alza bun, si alza anche questo numero: `bun upgrade` in locale e
          # un commit di package.json/bun.lock insieme a questa riga.
          bun-version: 1.4.2

      # Anche Node fissato, per lo stesso motivo di bun. I test girano dentro
      # jsdom, che carica un modulo ESM con `require()`: Node lo permette solo
      # dalla 22.12. Senza questa riga la CI dipenderebbe dal Node che capita
      # nell'immagine del runner, e un aggiornamento di quell'immagine
      # romperebbe i test per un motivo che non ha niente a che fare con questo
      # repository — che è il difetto che la versione di bun bloccata già
      # evita per un'altra ragione.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Installa le dipendenze
        run: bun install --frozen-lockfile

      - name: Formattazione
        # Non riformatta: segnala e basta. Riformattare in CI lascerebbe
        # il lavoro a metà e il check verde su un file che nessuno ha
        # scritto, che è il peggiore dei due.
        run: bun run format:check

      - name: Lint
        # Copre in particolare le regole sugli hook di React: chiamare un
        # hook dopo un return anticipato o dentro un ramo non lo vede
        # nessun typecheck, e in un'app come questa è il difetto che
        # romperebbe una sessione.
        run: bun run lint

      - name: Codice mai usato
        # Avvisa, non blocca: un export può essere usato solo da un test o da
        # uno script, e un controllo che sbaglia fa perdere fiducia.
        run: node scripts/morti.mjs

      - name: Typecheck
        run: bun run typecheck

      # Test vitest + smoke test dello schema SQLite su sql.js.
      - name: Test
        run: bun run test

      - name: Build
        # VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY servono a tenere
        # @supabase/supabase-js dentro il bundle: senza di esse esbuild lo
        # elimina in modo statico e la build riescirebbe, ma sarebbe più
        # leggera di quella che va online di oltre 50 kB, e ogni misura di
        # peso fatta su quella build mentirebbe.
        #
        # Le variabili vere stanno nell'ambiente "prod", che questo job non
        # dichiara, quindi qui arriverebbero vuote. Non serve la chiave vera:
        # per misurare basta che la libreria resti nel bundle, e la chiave
        # pubblica è pubblica per definizione (finisce nel bundle online).
        # Il ||= tiene la vera quando c'è, altrimenti un segnaposto della
        # stessa forma, così la misura resta quella giusta in entrambi i casi.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://esempio.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_00000000000000000000000000000000' }}
        run: bun run build

      - name: La web non è cresciuta troppo
        # Il bundle principale è l'unica cosa che scarica chi apre l'app, e
        # cresce da solo: un aggiornamento di una dipendenza può aggiungervi
        # decine di kB senza che nessuno se ne accorga. I tetti sono su
        # scripts/dimensioni.mjs, con scritti accanto i numeri di riferimento.
        run: node scripts/dimensioni.mjs

      - name: Nessun segreto nel bundle
        # La build fallirebbe già con una chiave privilegiata (vite.config.ts),
        # ma qui si controlla anche che non sia finito niente di altro.
        run: |
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{10,}|gh[porsu]_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|BEGIN [A-Z ]*PRIVATE KEY" dist/; then
            echo "::error::Trovato un segreto nel bundle pubblico"
            exit 1
          fi
          echo "Nessun segreto nel bundle"

      # Su una pull request lo schema viene solo CONTROLLATO, mai applicato.
      # Il controllo è la parte che può girare ovunque: se qualcuno mette una
      # riga che scrive un segreto, o lascia un segnaposto attivo, la pull
      # request è rossa prima di arrivare a master. Applicarlo qui sarebbe
      # dare a chi apre la pull request il permesso di scrivere sul database,
      # e su un fork non c'è nemmeno il token per farlo — ma su master
      # qualcuno lo ha, e quel qualcuno non è necessariamente chi ha aperto
      # la pull request.
      - name: Lo schema di Supabase è applicabile
        run: node scripts/migra-schema.mjs --check

      # La Edge Function pubblicata è una seconda copia del codice che sta
      # in supabase/, e nessuna delle due avvisa l'altra quando divergono.
      # È successo: dopo il passaggio a reportini.cazzevongole.com il
      # repository aveva l'origine nuova e la funzione no, quindi il login
      # con Google si fermava con un errore che non nominava la causa.
      #
      # Senza SUPABASE_ACCESS_TOKEN lo script esce dicendo che non può
      # confrontare, senza fallire: su un fork il secret non c'è, e un
      # controllo che non gira è uno che nessuno imparerebbe a leggere.
      - name: La Edge Function pubblicata è quella del repository
        run: node scripts/verifica-edge-function.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      # Applica lo schema, e solo qui. Le condizioni sono tre, e ognuna
      # chiude una porta diversa:
      #
      #   1. `push`: su una pull request questa macchina non deve poter
      #      scrivere sul database, per quanto sia trusted il branch.
      #   2. `master`: il ramo in cui si rilascia. Gli altri rami non
      #      scrivono, nemmeno in un merge di un fork.
      #   3. il tipo di evento è proprio `push`: GitHub attiva `push` anche
      #      per i tag, e un tag non è un merge.
      #
      # La copertura di `master` più `push` è voluta: il repository sviluppa
      # su master, e il fatto che esista anche `main` nel deploy della web non
      # significa che le migrazioni debbano poter partire da lì.
      #
      # Senza SUPABASE_ACCESS_TOKEN lo script esce dicendo che non può
      # applicare, senza fallire: su un fork il secret non c'è, e un controllo
      # che non gira è uno che nessuno imparerebbe a leggere.
      - name: Applica lo schema a Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/migra-schema.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      # Le Edge Function NON si pubblicano da qui, e va detto perché, perché è
      # una scelta e non una dimenticanza.
      #
      # L'API di gestione accetterebbe la pubblicazione e risponderebbe 200,
      # ma la funzione resterebbe spenta: `503 BOOT_ERROR`.
      #
      # Non è l'archivio a essere sbagliato, e questa è la parte che costò
      # più di tutte le altre: l'eszip è stato replicato byte per byte, e
      # `edge-runtime bundle` lo produce identico a quello della CLI. Il
      # difetto è che `PATCH` con l'eszip **cancella i primi quattro byte**
      # del corpo — si vede rileggendo indietro ciò che è stato salvato, che
      # inizia con `P2.3` invece che con `ESZIP2.3` — e anche anticipandoli,
      # con gli stessi byte e gli stessi metadati di una funzione che prima
      # funzionava, la funzione non riparte. Provato su `notifica-richiesta`
      # il 3 ottobre 2026, e riportato indietro con `supabase functions deploy`.
      #
      # Quindi la pubblicazione resta a mano con la CLI. Quello che invece fa
      # la CI è il confronto di `verifica-edge-function.mjs`, che è la metà che
      # si può automatizzare: dice se il codice qui è quello che risulta
      # pubblicato.
      #
      # Con la CLI, dopo aver modificato una funzione:
      #   supabase functions deploy <nome> --no-verify-jwt
      #   node scripts/deploya-edge-function.mjs --registra
      #
      # Il secondo passo serve perché il confronto legge l'hash da
      # `public.edge_function_deploy`, e quel `--registra` lo scrive: senza, il
      # confronto segnalerebbe che la funzione non è allineata anche se lo è.

  # Il confronto qui sopra guarda il **codice** della funzione pubblicata;
  # questo guarda se **risponde**: è raggiungibile, riconosce l'origine del
  # sito, e sa ancora parlare con Google. Sono due guasti diversi, e il secondo
  # non si vede dal repository: una funzione identica a questa può avere i
  # segreti vuoti, un elenco di origini sbagliato, o un progetto che non
  # risponde più.
  #
  # Non usa segreti — solo l'indirizzo pubblico del progetto, che sta
  # nell'ambiente "prod" insieme alle variabili della build. Se quell'indirizzo
  # non è configurato (un fork, un repository senza l'ambiente) lo script esce
  # dicendo che non può provare, e **non** fallisce: è la stessa scelta del
  # confronto dei sorgenti quando manca il token.
  backend:
    needs: verify
    runs-on: ubuntu-24.04
    # Le variabili dell'ambiente non arrivano da sole al job: va dichiarato,
    # come fa quello che compila la web.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Lo script non usa altro che `fetch` e i moduli di Node, quindi
          # qualunque Node recente andrebbe bene: la versione si fissa lo
          # stesso, perché la prova deve giudicare il backend e non il Node
          # che capita nel runner.
          node-version: 24

      - name: Il backend pubblicato risponde come deve
        run: node scripts/prova-backend.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
