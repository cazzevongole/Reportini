name: Versione automatica

# A ogni merge su master la versione sale da sola e si crea il tag
# "v<versione>": è il tag che fa partire il rilascio desktop.
#
# Il commit di versione tocca solo package.json, electron/package.json e
# CHANGELOG.md, e paths-ignore fa in modo che questo workflow non si
# rilanci da solo all'infinito.

on:
  push:
    branches: [master]
    paths-ignore:
      - "package.json"
      - "electron/package.json"
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      livello:
        description: Quanto alzare la versione
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: versione
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Livello del rilascio
        run: echo "LIVELLO=${{ inputs.livello || 'patch' }}" >> "$GITHUB_ENV"

      - name: Incrementa la versione
        run: node scripts/version.mjs "$LIVELLO"

      - name: Controlla la coerenza
        run: node scripts/versione-check.mjs

      - name: Commit e tag
        run: |
          VERSIONE=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json electron/package.json CHANGELOG.md
          git commit -m "Versione $VERSIONE"
          git tag "v$VERSIONE"
          git push origin "HEAD:master" "v$VERSIONE"
