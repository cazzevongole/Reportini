name: Deploy to GitHub Pages

on:
  push:
    # Il repository usa master, ma il workflow resta attivo anche su main:
    # senza i due rami un merge nell'altro branch non pubblicerebbe nulla.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Immagine bloccata, non "latest": GitHub annuncia la migrazione di
    # ubuntu-latest a Ubuntu 26 e avvisa su ogni run. Qui si vuole la 24.04,
    # che è quella nota, finché non la si cambia di proposito.
    runs-on: ubuntu-24.04
    # Le variabili VITE_* stanno nell'ambiente "prod": GitHub le rende
    # disponibili solo ai job che dichiarano quell'ambiente. Senza questa riga
    # il build le legge vuote e pubblica un'app che non fa entrare nessuno.
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vite sostituisce le VITE_* nel bundle: se mancano, l'app si pubblica
      # senza accesso con Google e senza salvataggio online, in silenzio.
      # Meglio un deploy che fallisce con un messaggio chiaro.
      - name: Controlla la configurazione
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Mancano VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY nell'ambiente 'prod' (Settings > Secrets and variables > Actions > Variables > prod)."
            exit 1
          fi
          # Il client id di Google non è bloccante: senza, l'accesso passa da
          # Supabase e il calendario resta scollegato. Ma il fallimento è
          # silenzioso — la build pubblica lo stesso — quindi qui si dice.
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::warning::VITE_GOOGLE_CLIENT_ID manca nell'ambiente 'prod': l'accesso funziona, ma chiederà solo il profilo e il calendario non sarà collegato."
          fi
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Build
        run: bun run build
        env:
          # Nessuna BASE_PATH: il sito sta nella radice di
          # https://reportini.cazzevongole.com, quindi gli asset si chiedono da
          # "/". Vite usa "/" anche quando la variabile manca, e impostarla a
          # "/" produrrebbe una base "//": da li i percorsi raddoppierebbero e
          # nulla caricherebbe.
          # Account Google + salvataggio online (Supabase). Obbligatorie per il
          # deploy: in locale l'app parte anche senza, ma online resterebbe
          # chiusa a chiunque.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Senza questa riga la build pubblica un'app in cui l'accesso con
          # Google è spento: Vite la sostituisce con una stringa vuota e la
          # funzione di accesso sparisce dal bundle, senza nessun errore.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_DEV_WHITELIST: ${{ vars.VITE_DEV_WHITELIST }}

      # I job girano su runner separati: senza questo passaggio il job di
      # deploy si trova davanti una dist/ inesistente e muore su "tar: dist:
      # Cannot open".
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: build
    # Immagine bloccata, non "latest": GitHub annuncia la migrazione di
    # ubuntu-latest a Ubuntu 26 e avvisa su ogni run. Qui si vuole la 24.04,
    # che è quella nota, finché non la si cambia di proposito.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
