name: Deploy to GitHub Pages

on:
  push:
    # Il repository usa master, ma il workflow resta attivo anche su main:
    # senza i due rami un merge nell'altro branch non pubblicerebbe nulla.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Assets are served from https://<user>.github.io/Reportini/
          BASE_PATH: /Reportini
          # Account Google + salvataggio online (Supabase). Facoltativi:
          # senza questi l'app funziona comunque in locale.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_DEV_WHITELIST: ${{ vars.VITE_DEV_WHITELIST }}

      # I job girano su runner separati: senza questo passaggio il job di
      # deploy si trova davanti una dist/ inesistente e muore su "tar: dist:
      # Cannot open".
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
